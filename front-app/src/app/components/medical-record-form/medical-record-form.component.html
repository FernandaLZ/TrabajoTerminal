<form [formGroup]="medicalForm" (ngSubmit)="onSubmit()">
  <div class="form-container">

    <!-- Nombre -->
    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre completo">
    </mat-form-field>

    <!-- Sexo -->
    <mat-form-field appearance="fill">
      <mat-label>Sexo</mat-label>
      <mat-select formControlName="sexo">
        <mat-option value="masculino">Masculino</mat-option>
        <mat-option value="femenino">Femenino</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Edad -->
    <mat-form-field appearance="fill">
      <mat-label>Edad</mat-label>
      <input matInput formControlName="edad" type="number" placeholder="Edad">
    </mat-form-field>

    <!-- Fecha de nacimiento -->
    <mat-form-field appearance="fill">
      <mat-label>Fecha de nacimiento</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fechaNacimiento">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Alergias -->
    <mat-form-field appearance="fill">
      <mat-label>Alergias</mat-label>
      <textarea matInput formControlName="alergias" placeholder="Especificar alergias"></textarea>
    </mat-form-field>

    <!-- Antecedentes quirúrgicos -->
    <mat-form-field appearance="fill">
      <mat-label>Antecedentes quirúrgicos</mat-label>
      <textarea matInput formControlName="antecedentesQuirurgicos" placeholder="Especificar antecedentes quirúrgicos"></textarea>
    </mat-form-field>

    <!-- Checkbox: Antecedentes psicológicos -->
    <mat-checkbox formControlName="antecedentesPsicologicos">Antecedentes psicológicos</mat-checkbox>

    <!-- Checkbox: Cardiopatías -->
    <mat-checkbox formControlName="cardiopatia">Cardiopatías</mat-checkbox>

    <!-- Otros campos de antecedentes (similar a los anteriores) -->

    <!-- Vacunas -->
    <mat-form-field appearance="fill">
      <mat-label>Vacunas</mat-label>
      <textarea matInput formControlName="vacunas" placeholder="Especificar vacunas"></textarea>
    </mat-form-field>

    <!-- Enfermedades crónicas -->
    <mat-form-field appearance="fill">
      <mat-label>Enfermedades crónicas</mat-label>
      <textarea matInput formControlName="enfermedadesCronicas" placeholder="Especificar enfermedades crónicas"></textarea>
    </mat-form-field>

    <!-- Medicación -->
    <mat-form-field appearance="fill">
      <mat-label>Medicación</mat-label>
      <textarea matInput formControlName="medicacion" placeholder="Especificar medicación"></textarea>
    </mat-form-field>

    <!-- Notas -->
    <mat-form-field appearance="fill">
      <mat-label>Otros</mat-label>
      <textarea matInput formControlName="otros" placeholder="Notas adicionales"></textarea>
    </mat-form-field>

    <!-- Botón de envío -->
    <button mat-raised-button color="primary" type="submit" [disabled]="medicalForm.invalid">Enviar</button>
  </div>
</form>
